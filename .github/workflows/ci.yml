name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deployment config is present
        run: |
          test -f render.yaml || (echo "render.yaml missing" && exit 1)
          test -f build.sh || (echo "build.sh missing" && exit 1)
          test -f backend/wsgi.py || (echo "wsgi.py missing" && exit 1)
          echo "Deployment configuration looks complete."
