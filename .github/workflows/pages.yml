name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always builds, tests and uploads the artifact. This job cannot fail for
  # permission reasons, so the pipeline stays green even before Pages is enabled.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install
        working-directory: demo
        run: npm ci --no-audit --no-fund

      - name: Verify the browser engine matches the Python engine
        working-directory: demo
        run: npm test

      - name: Build
        working-directory: demo
        run: npm run build

      - name: Package artifact
        run: |
          cd demo/dist
          tar -czf ../../solar-advisor-demo.tar.gz .
          echo "Packaged $(du -h ../../solar-advisor-demo.tar.gz | cut -f1) artifact"

      - uses: actions/upload-artifact@v4
        with:
          name: solar-advisor-demo
          path: solar-advisor-demo.tar.gz
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  # Only runs once Pages is enabled on the repository (Settings → Pages →
  # Source: GitHub Actions). Until then it is skipped rather than failing.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Report Pages status
        run: |
          if [ "${{ steps.pages.outputs.base_url }}" = "" ]; then
            echo "::notice title=Pages not enabled::Enable Settings → Pages → Source: GitHub Actions to publish. The built site is in the 'solar-advisor-demo' artifact."
          else
            echo "Pages site: ${{ steps.pages.outputs.base_url }}"
          fi

      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.base_url != ''
